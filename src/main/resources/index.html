<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
    <header>
        <h1>Student Management System</h1>
        <p>Add, view, edit, search, and delete student records</p>
    </header>

    <section class="form-card">
        <h2 id="form-title">Add Student</h2>

        <form id="student-form">
            <input type="hidden" id="student-id" />

            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter full name" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" required />
                </div>

                <div class="form-group">
                    <label for="roll">Roll Number</label>
                    <input type="text" id="roll" placeholder="Enter roll number" required />
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Enter course" required />
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required />
                </div>

                <div class="form-group">
                    <label for="grade">Grade</label>
                    <select id="grade" required>
                        <option value="">Select grade</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" id="submit-btn" class="btn primary">
                    Save Student
                </button>
                <button type="button" id="cancel-btn" class="btn secondary">
                    Cancel
                </button>
            </div>
        </form>
    </section>

    <section class="table-card">
        <div class="table-header">
            <h2>Student Records</h2>
            <input
                    type="text"
                    id="search"
                    placeholder="Search by name, roll number, or course..."
            />
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Roll No.</th>
                    <th>Course</th>
                    <th>Phone</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="student-table-body"></tbody>
            </table>
        </div>

        <p id="empty-message" class="empty-message">
            No students found. Add a student to get started.
        </p>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
